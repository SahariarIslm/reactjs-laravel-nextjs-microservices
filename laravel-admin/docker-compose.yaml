services:
    frontend:
        image: antoniopapa1991/admin-frontend
        ports:
            - "3000:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - backend

    backend:
        container_name: admin_api
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - DB_HOST=db
            - DB_DATABASE=admin
            - DB_USERNAME=root
            - DB_PASSWORD=root
        ports:
            - 8000:8000
        volumes:
            - .:/app
        depends_on:
            - db

    db:
        container_name: admin_db
        image: mysql:9.7.0
        environment:
            - MYSQL_DATABASE=admin
            - MYSQL_ROOT_PASSWORD=root
        volumes:
            - .dbdata:/var/lib/mysql
        ports:
            - 33066:3306
