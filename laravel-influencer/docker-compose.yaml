services:
    frontend:
        image: antoniopapa1991/admin-frontend
        ports:
            - "3000:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - backend

    backend:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - DB_HOST=db
            - DB_DATABASE=influencer
            - DB_USERNAME=root
            - DB_PASSWORD=root
            - REDIS_HOST=redis
        ports:
            - 8000:8000
        volumes:
            - .:/app
        depends_on:
            - db
            - redis

    db:
        image: mysql:9.7.0
        environment:
            - MYSQL_DATABASE=influencer
            - MYSQL_ROOT_PASSWORD=root
        volumes:
            - .dbdata:/var/lib/mysql
        ports:
            - 33066:3306

    phpmyadmin:
        container_name: admin_pma
        image: phpmyadmin:latest
        ports:
            - "8080:80"
        environment:
            - PMA_HOST=db
            - PMA_PORT=3306
            - PMA_USER=root
            - PMA_PASSWORD=root
        depends_on:
            - db
    mailpit:
        image: axllent/mailpit
        container_name: laravel_mailpit
        ports:
            - "1025:1025"
            - "8025:8025"

    redis:
        image: redis:latest

volumes:
    mysql_data:
